name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'compute-framework/**'
      - '.github/workflows/deploy-infrastructure.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: kernelbench-infra-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  GPU_AMI_SSM_PARAMETER_NAME: ${{ vars.KERNELBENCH_GPU_AMI_SSM_PARAMETER_NAME || '/kernelbench/gpu/latest-ami-id' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect GPU AMI-affecting changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gpu_ami:
              - 'infrastructure/lib/gpu-benchmark-stack.ts'
              - 'infrastructure/bin/gpu-compute-infra.ts'
              - 'infrastructure/scripts/prepare_gpu_ami.sh'
              - 'infrastructure/scripts/remote_kernel_benchmark.sh'
              - 'compute-framework/CMakeLists.txt'
              - '.github/workflows/deploy-infrastructure.yml'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install infrastructure deps
        working-directory: infrastructure
        run: npm install

      - name: Build infrastructure
        working-directory: infrastructure
        run: npm run build

      - name: Check whether infrastructure stack exists
        id: stack
        run: |
          if aws cloudformation describe-stacks \
            --stack-name KernelBench-Infrastructure \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bake and publish latest GPU AMI
        if: steps.changes.outputs.gpu_ami == 'true' && steps.stack.outputs.exists == 'true'
        run: |
          set -euo pipefail

          wait_for_ssm_online() {
            for attempt in $(seq 1 60); do
              INSTANCE_PING_STATUS=$(aws ssm describe-instance-information \
                --region "$AWS_REGION" \
                --filters "Key=InstanceIds,Values=$AMI_BUILDER_INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text 2>/dev/null || true)

              if [ "$INSTANCE_PING_STATUS" = "Online" ]; then
                return 0
              fi

              if [ "$attempt" -eq 60 ]; then
                echo "Timed out waiting for SSM on AMI builder instance $AMI_BUILDER_INSTANCE_ID" >&2
                return 1
              fi

              sleep 20
            done
          }

          wait_for_prepare_marker() {
            for attempt in $(seq 1 45); do
              PREP_COMMAND_ID=$(aws ssm send-command \
                --instance-ids "$AMI_BUILDER_INSTANCE_ID" \
                --document-name AWS-RunShellScript \
                --comment "Check KernelBench GPU AMI prep marker" \
                --region "$AWS_REGION" \
                --parameters commands='["test -f /opt/kernel-bench/image-prepared"]' \
                --query 'Command.CommandId' \
                --output text)

              if aws ssm wait command-executed \
                --command-id "$PREP_COMMAND_ID" \
                --instance-id "$AMI_BUILDER_INSTANCE_ID" \
                --region "$AWS_REGION" >/dev/null 2>&1; then
                return 0
              fi

              if [ "$attempt" -eq 45 ]; then
                echo "Timed out waiting for /opt/kernel-bench/image-prepared on $AMI_BUILDER_INSTANCE_ID" >&2
                aws ssm get-command-invocation \
                  --command-id "$PREP_COMMAND_ID" \
                  --instance-id "$AMI_BUILDER_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json || true
                return 1
              fi

              sleep 20
            done
          }

          run_prepare_commands() {
            PREPARE_COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$AMI_BUILDER_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Prepare KernelBench GPU AMI" \
              --region "$AWS_REGION" \
              --parameters commands='["set -euxo pipefail","dnf update -y","dnf install -y git cmake gcc gcc-c++ make tar gzip unzip jq awscli python3 python3-pip amazon-cloudwatch-agent kernel-devel kernel-headers dkms","dnf install -y dnf-plugins-core","dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/amzn2023/x86_64/cuda-amzn2023.repo","dnf clean all","dnf makecache","DRIVER_PKG=\"\"","if dnf list --available nvidia-driver-latest-dkms >/dev/null 2>&1; then DRIVER_PKG=\"nvidia-driver-latest-dkms\"; fi","if [ -z \"$DRIVER_PKG\" ] && dnf list --available nvidia-driver >/dev/null 2>&1; then DRIVER_PKG=\"nvidia-driver\"; fi","if [ -z \"$DRIVER_PKG\" ] && dnf list --available kmod-nvidia-latest-dkms >/dev/null 2>&1; then DRIVER_PKG=\"kmod-nvidia-latest-dkms\"; fi","if [ -n \"$DRIVER_PKG\" ]; then dnf install -y \"$DRIVER_PKG\"; else echo \"No supported NVIDIA driver package found\" >&2; dnf list --available \"*nvidia*\" || true; exit 1; fi","dnf install -y cuda-compiler-12-6 cuda-cudart-devel-12-6 cuda-libraries-devel-12-6","modprobe nvidia || true","ln -sf /usr/local/cuda-12.6/bin/nvcc /usr/local/bin/nvcc","cat >/etc/profile.d/kernelbench-cuda.sh <<'\''EOF'\''","export PATH=/usr/local/cuda-12.6/bin:$PATH","export CUDAToolkit_ROOT=/usr/local/cuda-12.6","EOF","mkdir -p /opt/kernel-bench","chown ec2-user:ec2-user /opt/kernel-bench","touch /opt/kernel-bench/image-prepared"]' \
              --query 'Command.CommandId' \
              --output text)

            if ! aws ssm wait command-executed \
              --command-id "$PREPARE_COMMAND_ID" \
              --instance-id "$AMI_BUILDER_INSTANCE_ID" \
              --region "$AWS_REGION"; then
              aws ssm get-command-invocation \
                --command-id "$PREPARE_COMMAND_ID" \
                --instance-id "$AMI_BUILDER_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                --output json || true
              return 1
            fi
          }

          validate_gpu_image() {
            VALIDATION_COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$AMI_BUILDER_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Validate KernelBench GPU AMI" \
              --region "$AWS_REGION" \
              --parameters commands='["set -euxo pipefail","test -f /opt/kernel-bench/image-prepared","command -v nvidia-smi","nvidia-smi","command -v nvcc","nvcc --version","cmake --version"]' \
              --query 'Command.CommandId' \
              --output text)

            if ! aws ssm wait command-executed \
              --command-id "$VALIDATION_COMMAND_ID" \
              --instance-id "$AMI_BUILDER_INSTANCE_ID" \
              --region "$AWS_REGION"; then
              aws ssm get-command-invocation \
                --command-id "$VALIDATION_COMMAND_ID" \
                --instance-id "$AMI_BUILDER_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                --output json || true
              return 1
            fi
          }

          GPU_INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name KernelBench-Infrastructure \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='KernelBenchGpuInstanceId'].OutputValue" \
            --output text)

          if [ -z "$GPU_INSTANCE_ID" ] || [ "$GPU_INSTANCE_ID" = "None" ]; then
            echo "KernelBenchGpuInstanceId is not available on the currently deployed stack yet; skipping AMI bake for this run."
            exit 0
          fi

          AMI_BUILDER_INSTANCE_ID=""
          ORIGINAL_GPU_STATE=""
          cleanup() {
            if [ -n "$AMI_BUILDER_INSTANCE_ID" ] && [ "$ORIGINAL_GPU_STATE" = "stopped" ]; then
              aws ec2 stop-instances \
                --instance-ids "$AMI_BUILDER_INSTANCE_ID" \
                --region "$AWS_REGION" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          AMI_BUILDER_INSTANCE_ID="$GPU_INSTANCE_ID"
          ORIGINAL_GPU_STATE=$(aws ec2 describe-instances \
            --instance-ids "$AMI_BUILDER_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          if [ "$ORIGINAL_GPU_STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$AMI_BUILDER_INSTANCE_ID" --region "$AWS_REGION" >/dev/null
          fi

          aws ec2 wait instance-running --instance-ids "$AMI_BUILDER_INSTANCE_ID" --region "$AWS_REGION"
          aws ec2 wait instance-status-ok --instance-ids "$AMI_BUILDER_INSTANCE_ID" --region "$AWS_REGION"
          wait_for_ssm_online
          run_prepare_commands
          wait_for_prepare_marker

          if ! validate_gpu_image; then
            REBOOT_COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$AMI_BUILDER_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Reboot KernelBench GPU AMI builder" \
              --region "$AWS_REGION" \
              --parameters commands='["sudo reboot"]' \
              --query 'Command.CommandId' \
              --output text)

            aws ssm wait command-executed \
              --command-id "$REBOOT_COMMAND_ID" \
              --instance-id "$AMI_BUILDER_INSTANCE_ID" \
              --region "$AWS_REGION" || true

            aws ec2 wait instance-status-ok --instance-ids "$AMI_BUILDER_INSTANCE_ID" --region "$AWS_REGION"
            wait_for_ssm_online
            run_prepare_commands
            wait_for_prepare_marker
            validate_gpu_image
          fi

          AMI_NAME="kernelbench-gpu-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::12}"
          AMI_ID=$(aws ec2 create-image \
            --instance-id "$AMI_BUILDER_INSTANCE_ID" \
            --name "$AMI_NAME" \
            --description "KernelBench GPU runner image built from ${GITHUB_SHA}" \
            --tag-specifications "ResourceType=image,Tags=[{Key=Name,Value=$AMI_NAME},{Key=Project,Value=KernelBench},{Key=GitSha,Value=${GITHUB_SHA}}]" \
            --region "$AWS_REGION" \
            --query 'ImageId' \
            --output text)

          aws ec2 wait image-available --image-ids "$AMI_ID" --region "$AWS_REGION"

          aws ssm put-parameter \
            --name "$GPU_AMI_SSM_PARAMETER_NAME" \
            --value "$AMI_ID" \
            --type String \
            --overwrite \
            --region "$AWS_REGION" >/dev/null

          if [ "$ORIGINAL_GPU_STATE" = "stopped" ]; then
            aws ec2 stop-instances --instance-ids "$AMI_BUILDER_INSTANCE_ID" --region "$AWS_REGION" >/dev/null
            aws ec2 wait instance-stopped --instance-ids "$AMI_BUILDER_INSTANCE_ID" --region "$AWS_REGION"
          fi

          echo "Published GPU AMI $AMI_ID to $GPU_AMI_SSM_PARAMETER_NAME"

      - name: Resolve latest GPU AMI from SSM
        id: gpu_ami
        run: |
          GPU_AMI_ID=$(aws ssm get-parameter \
            --name "$GPU_AMI_SSM_PARAMETER_NAME" \
            --region "$AWS_REGION" \
            --query 'Parameter.Value' \
            --output text 2>/dev/null || true)

          if [ -n "$GPU_AMI_ID" ] && [ "$GPU_AMI_ID" != "None" ]; then
            echo "gpu_ami_id=$GPU_AMI_ID" >> "$GITHUB_OUTPUT"
            echo "KERNELBENCH_GPU_AMI_ID=$GPU_AMI_ID" >> "$GITHUB_ENV"
          fi

      - name: Deploy CDK stack
        working-directory: infrastructure
        run: |
          npx cdk deploy \
            --require-approval never \
            --parameters KernelBenchOriginVerifySecret=${{ secrets.KERNELBENCH_ORIGIN_VERIFY_SECRET || 'KernelBench-ChangeMe' }} \
            --parameters KernelBenchGitHubRepo=${{ vars.KERNELBENCH_GITHUB_REPO || 'owner/repo' }} \
            --parameters KernelBenchGitHubBranch=${{ vars.KERNELBENCH_GITHUB_BRANCH || 'main' }}

      - name: Resolve artifact bucket output
        id: outputs
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name KernelBench-Infrastructure \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='KernelBenchArtifactBucketName'].OutputValue" \
            --output text)

          if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" = "None" ]; then
            echo "Could not resolve KernelBenchArtifactBucketName from stack outputs" >&2
            exit 1
          fi

          echo "artifact_bucket=$BUCKET_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload latest source archive
        run: ./infrastructure/scripts/upload-source.sh "${{ steps.outputs.outputs.artifact_bucket }}"
