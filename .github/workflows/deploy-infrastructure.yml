name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'compute-framework/**'
      - '.github/workflows/deploy-infrastructure.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: kernelbench-infra-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  KERNELBENCH_GPU_AMI_ID: ${{ vars.KERNELBENCH_GPU_AMI_ID || secrets.KERNELBENCH_GPU_AMI_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install infrastructure deps
        working-directory: infrastructure
        run: npm install

      - name: Build infrastructure
        working-directory: infrastructure
        run: npm run build

      - name: Deploy CDK stack
        working-directory: infrastructure
        run: |
          npx cdk deploy \
            --require-approval never \
            --parameters KernelBenchOriginVerifySecret=${{ secrets.KERNELBENCH_ORIGIN_VERIFY_SECRET || 'KernelBench-ChangeMe' }} \
            --parameters KernelBenchGitHubRepo=${{ vars.KERNELBENCH_GITHUB_REPO || 'owner/repo' }} \
            --parameters KernelBenchGitHubBranch=${{ vars.KERNELBENCH_GITHUB_BRANCH || 'main' }}

      - name: Resolve artifact bucket output
        id: outputs
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name KernelBench-Infrastructure \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='KernelBenchArtifactBucketName'].OutputValue" \
            --output text)

          if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" = "None" ]; then
            echo "Could not resolve KernelBenchArtifactBucketName from stack outputs" >&2
            exit 1
          fi

          echo "artifact_bucket=$BUCKET_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload latest source archive
        run: ./infrastructure/scripts/upload-source.sh "${{ steps.outputs.outputs.artifact_bucket }}"
